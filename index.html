<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0d12">
<title>bamobus · Live-Abfahrtstafel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12; --panel:#11161e; --panel2:#161d27; --line:#222c39;
    --amber:#ff9b00; --amber-soft:#ffce5c; --green:#37d67a; --red:#ff5d5d;
    --muted:#7c8ba1; --text:#e8eef6;
    --led:#ff9b00; --led-dim:#7a4a00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0a0d12}
  /* Im nativen Vollbild dunklen Hintergrund erzwingen (sonst weiß auf manchen Geräten) */
  :fullscreen{background:#050402}
  :-webkit-full-screen{background:#050402}
  ::backdrop{background:#050402}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #16202c 0%, var(--bg) 60%);
    color:var(--text); font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}

  header{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
  header .dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  header h1{font-size:18px;font-weight:700;letter-spacing:.3px;margin:0}
  header h1 b{color:var(--amber)}
  header .sub{color:var(--muted);font-size:12px;margin-left:auto}

  .search{position:relative;margin-bottom:10px}
  .search-row{display:flex;gap:8px}
  .search input{
    flex:1;width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:16px;outline:none;
  }
  .search input:focus{border-color:var(--amber)}
  .gps{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--amber-soft);
    border-radius:14px;padding:0 14px;font-size:20px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .gps:hover{border-color:var(--amber)}
  .gps .t{font-size:13px}
  .gps.busy{opacity:.6;pointer-events:none}

  .results{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;
    background:var(--panel2);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.5);max-height:60vh;overflow-y:auto}
  .results .grp{padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);background:#10151d}
  .results button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;
    background:none;border:0;color:var(--text);padding:12px 14px;cursor:pointer;font-size:15px;border-bottom:1px solid var(--line)}
  .results button:last-child{border-bottom:0}
  .results button:hover{background:#1d2735}
  .results .ic{width:20px;text-align:center;flex:0 0 auto}
  .results .meta{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
  .chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    color:var(--text);padding:8px 10px 8px 12px;border-radius:999px;font-size:14px;cursor:pointer}
  .chip.active{border-color:var(--amber);color:var(--amber-soft);background:#1a2230}
  .chip .x{color:var(--muted);font-size:16px;line-height:1;padding:0 2px;border-radius:50%}
  .chip .x:hover{color:var(--red)}

  /* Filterleiste */
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;align-items:center}
  .fbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
  .fbtn.on{border-color:var(--amber);color:var(--amber-soft);background:#1a2230}
  .fbtn .mi{font-size:14px}
  .fbtn.fav.on{border-color:var(--amber);color:var(--amber);background:#241a08}
  .fsep{flex:1}

  /* === LED-Abfahrtstafel (Look wie Straßenanzeige) === */
  .board{
    background:#050402; border:1px solid #1c1305; border-radius:12px; overflow:hidden;
    box-shadow:inset 0 0 80px rgba(255,140,0,.05), 0 10px 30px rgba(0,0,0,.5);
    font-family:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  .board-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #1c1305;background:#0a0703}
  .board-head h2{margin:0;font-size:16px;font-weight:400;color:var(--led);text-shadow:0 0 8px rgba(255,140,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
  .board-head .meta{color:var(--led-dim);font-size:12px;margin-left:auto;text-align:right;white-space:nowrap}

  /* Tabellen-Layout: feste Spalten, lange Texte werden mit … gekürzt (keine Überlappung) */
  .deps{width:100%;border-collapse:collapse;table-layout:fixed}
  .deps col.c-star{width:34px}
  .deps col.c-line{width:104px}
  .deps col.c-dest{width:auto}
  .deps col.c-eta{width:96px}
  .deps td{padding:11px 0;border-bottom:1px solid #140d03;vertical-align:middle;overflow:hidden}
  .deps tr:last-child td{border-bottom:0}
  .td-star{text-align:center;padding-left:16px!important}
  .td-eta{padding-right:16px!important}
  .star{background:none;border:0;cursor:pointer;font-size:16px;color:var(--led-dim);line-height:1;padding:0;text-shadow:none}
  .star.on{color:var(--led);text-shadow:0 0 8px rgba(255,140,0,.6)}
  .ln{color:var(--led);font-size:24px;font-weight:400;letter-spacing:1px;text-shadow:0 0 7px rgba(255,140,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .td-dest{color:var(--led);text-shadow:0 0 6px rgba(255,140,0,.45);padding-left:12px;padding-right:12px}
  .d-name{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
  .d-sub{font-size:12px;color:var(--led-dim);text-shadow:none;margin-top:2px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .d-sub .delay{color:#ff6a3d}
  .d-sub .cancelled{color:#ff5d5d}
  .td-eta{text-align:right;white-space:nowrap;color:var(--led);text-shadow:0 0 7px rgba(255,140,0,.55);font-variant-numeric:tabular-nums}
  .eta-v{font-size:22px;letter-spacing:1px}
  .eta-v.now{color:#ffd23d;text-shadow:0 0 9px rgba(255,200,0,.6)}
  .eta-u{font-size:12px;color:var(--led-dim);text-shadow:none}
  .eta-clk{font-size:11px;color:var(--led-dim);text-shadow:none;margin-top:1px}

  /* Paginator */
  .pager{display:flex;gap:8px;justify-content:center;align-items:center;padding:10px 0 12px;background:#0a0703;border-top:1px solid #140d03}
  .pager .dot2{width:9px;height:9px;border-radius:50%;background:#3a2705;cursor:pointer;transition:background .3s,box-shadow .3s}
  .pager .dot2.on{background:var(--led);box-shadow:0 0 8px rgba(255,140,0,.6)}
  .pager .pinfo{color:var(--led-dim);font-size:11px;margin-left:6px}

  .empty{padding:34px 16px;text-align:center;color:var(--led-dim);font-size:14px;line-height:1.6;font-family:"Share Tech Mono",monospace}
  .empty .big{font-size:30px;margin-bottom:8px}
  .loading{padding:24px;text-align:center;color:var(--led-dim);font-size:14px;font-family:"Share Tech Mono",monospace}
  footer{margin-top:18px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}
  a{color:var(--amber-soft);text-decoration:none}

  /* === Vollbild / Kiosk-Modus (Tablet & Monitor) === */
  #kioskExit{position:fixed;top:12px;right:12px;z-index:50;display:none;
    background:#1a1206;color:var(--led);border:1px solid #4a3206;border-radius:10px;
    font-size:20px;width:46px;height:46px;cursor:pointer;line-height:1}
  #kioskExit:hover{border-color:var(--led)}
  body.kiosk{overflow:hidden}
  body.kiosk #kioskExit{display:block}
  body.kiosk .wrap{max-width:none;width:100vw;height:100vh;padding:0;margin:0}
  body.kiosk header,body.kiosk .search,body.kiosk .chips,body.kiosk .filters,body.kiosk footer{display:none!important}
  body.kiosk .board{height:100vh;border:0;border-radius:0;display:flex;flex-direction:column;box-shadow:none}
  body.kiosk .board-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vmin;padding:2.4vmin 3.2vmin}
  body.kiosk .board-head h2{font-size:clamp(20px,3.6vmin,52px);min-width:0;margin:0}
  body.kiosk .board-head .meta{margin:0;text-align:center;font-size:clamp(14px,2.8vmin,36px)}
  body.kiosk #rows{flex:1;display:flex;flex-direction:column}
  body.kiosk .deps{height:100%}
  body.kiosk .deps col.c-star{width:0}
  body.kiosk .deps col.c-line{width:clamp(70px,16vmin,240px)}
  body.kiosk .deps col.c-eta{width:clamp(130px,27vmin,400px)}
  body.kiosk .deps td{padding:0 0;border-bottom:1px solid #160e03}
  body.kiosk .td-star{padding-left:0!important;width:0}
  body.kiosk .star{display:none}
  body.kiosk .td-dest{padding-left:2.6vmin}
  body.kiosk .td-eta{padding-right:3.2vmin}
  body.kiosk .ln{font-size:clamp(30px,7.4vmin,104px);letter-spacing:2px;padding-left:3.2vmin}
  body.kiosk .d-name{font-size:clamp(26px,6.2vmin,92px)}
  body.kiosk .d-sub{font-size:clamp(13px,2.3vmin,30px);margin-top:.6vmin}
  body.kiosk .eta-v{font-size:clamp(26px,6vmin,84px)}
  body.kiosk .eta-u{font-size:clamp(13px,2.3vmin,30px)}
  body.kiosk .eta-clk{font-size:clamp(12px,2vmin,26px)}
  body.kiosk .pager{padding:1.4vmin 0}
  body.kiosk .pager .dot2{width:1.3vmin;height:1.3vmin}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot"></span>
    <h1>bamo<b>bus</b></h1>
    <span class="sub" id="status">live · Baden-Württemberg</span>
  </header>

  <div class="search">
    <div class="search-row">
      <input id="q" type="text" placeholder="Haltestelle oder Adresse … (z. B. Stuttgart Hbf)" autocomplete="off">
      <button class="gps" id="gps" title="Haltestellen in meiner Nähe"><span>📍</span><span class="t">Nähe</span></button>
    </div>
    <div class="results" id="results" style="display:none"></div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="filters" id="filters">
    <button class="fbtn on" data-mode="bus"><span class="mi">🚌</span>Bus</button>
    <button class="fbtn on" data-mode="sbahn"><span class="mi">Ⓢ</span>S-Bahn</button>
    <button class="fbtn on" data-mode="ubahn"><span class="mi">Ⓤ</span>U-Bahn</button>
    <button class="fbtn on" data-mode="regio"><span class="mi">🚆</span>Regio</button>
    <span class="fsep"></span>
    <button class="fbtn fav" id="favBtn"><span class="mi">★</span>Nur Favoriten</button>
    <button class="fbtn" id="fsBtn"><span class="mi">⛶</span>Vollbild</button>
  </div>

  <div class="board">
    <div class="board-head">
      <h2 id="stopName">Keine Haltestelle gewählt</h2>
      <div class="meta" id="boardMeta"></div>
    </div>
    <div id="rows">
      <div class="empty"><div class="big">🚏</div>
        Tippe eine Haltestelle oder Adresse ein – oder nutze <b>📍 Nähe</b>.</div>
    </div>
    <div class="pager" id="pager" style="display:none"></div>
  </div>

  <footer>
    Daten: <a href="https://transitous.org" target="_blank" rel="noopener">Transitous</a> (MOTIS, DELFI/bwegt) ·
    Live mit Echtzeit-Verspätungen · Auto-Refresh 30 s · Favoriten & Filter lokal gespeichert.
  </footer>
</div>
<button id="kioskExit" title="Vollbild beenden (Esc)">⛶</button>

<script>
const API = "https://api.transitous.org/api/v1";
const K_STOPS="bamobus_stops_v1", K_ACTIVE="bamobus_active_v1", K_FAV="bamobus_fav_v1", K_FILTER="bamobus_filter_v1", K_FAVONLY="bamobus_favonly_v1";
const PAGE = 5, FETCH_N = 40, REFRESH_MS = 30000, PAGE_MS = 5000;
const DEFAULT_STOP = { id:"de-DELFI_de:08111:6115", name:"Stuttgart Hauptbahnhof" };

let saved   = load(K_STOPS, []);     // [{id,name}]
let activeId = load(K_ACTIVE, null);
let favs    = new Set(load(K_FAV, []));            // keys: stopId|line|headsign
let modeOn  = load(K_FILTER, {bus:true,sbahn:true,ubahn:true,regio:true});
let favOnly = load(K_FAVONLY, false);
let lastDepartures = [];
let boardList = [];   // gefilterte Abfahrten (alle Seiten)
let page = 0;         // aktuelle Paginator-Seite
let refreshTimer, tickTimer, searchTimer, pagerTimer;

const $ = s => document.querySelector(s);
const qInput=$("#q"), resultsEl=$("#results"), chipsEl=$("#chips"), rowsEl=$("#rows"), pagerEl=$("#pager");

function load(k,fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch{ return fb; } }
function store(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function apiGet(p){ const r=await fetch(API+p,{headers:{Accept:"application/json"}}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }

/* Verkehrsmittel -> Filterkategorie (BW: Stadtbahn U1.. läuft als TRAM → zu U-Bahn) */
function categoryOf(mode){
  switch(mode){
    case "BUS": case "COACH": case "TROLLEYBUS": return "bus";
    case "SUBURBAN": return "sbahn";
    case "SUBWAY": case "METRO": case "TRAM": case "CABLE_CAR": case "FUNICULAR": case "AERIAL_LIFT": return "ubahn";
    case "REGIONAL_RAIL": case "REGIONAL_FAST_RAIL": case "RAIL": case "HIGHSPEED_RAIL":
    case "LONG_DISTANCE": case "NIGHT_RAIL": case "FERRY": return "regio";
    default: return "regio";
  }
}
function favKey(d, stopId){ return `${stopId}|${d.routeShortName||d.displayName||"?"}|${d.headsign||""}`; }

/* ---------- Suche ---------- */
qInput.addEventListener("input", ()=>{
  const v=qInput.value.trim(); clearTimeout(searchTimer);
  if(v.length<2){ resultsEl.style.display="none"; return; }
  searchTimer=setTimeout(()=>geocode(v),250);
});
document.addEventListener("click",e=>{ if(!resultsEl.contains(e.target)&&e.target!==qInput) resultsEl.style.display="none"; });

async function geocode(query){
  try{
    const data=await apiGet(`/geocode?text=${encodeURIComponent(query)}&language=de`);
    const stops=data.filter(d=>d.type==="STOP").slice(0,6);
    const places=data.filter(d=>d.type==="ADDRESS"||d.type==="PLACE").slice(0,4);
    if(!stops.length&&!places.length){ resultsEl.style.display="none"; return; }
    let html="";
    if(stops.length){ html+=`<div class="grp">Haltestellen</div>`+stops.map(s=>
      `<button data-kind="stop" data-id="${esc(s.id)}" data-name="${esc(s.name)}"><span class="ic">📍</span><span>${esc(s.name)}</span></button>`).join(""); }
    if(places.length){ html+=`<div class="grp">Adressen / Orte – nächste Haltestelle finden</div>`+places.map(p=>
      `<button data-kind="place" data-lat="${p.lat}" data-lon="${p.lon}" data-name="${esc(p.name)}"><span class="ic">${p.type==="ADDRESS"?"🏠":"📌"}</span><span>${esc(p.name)}</span></button>`).join(""); }
    resultsEl.innerHTML=html;
    resultsEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      if(b.dataset.kind==="stop"){ addStop(b.dataset.id,b.dataset.name); closeResults(); }
      else showNearby(+b.dataset.lat,+b.dataset.lon,b.dataset.name);
    });
    resultsEl.style.display="block";
  }catch(e){ resultsEl.style.display="none"; }
}
function closeResults(){ resultsEl.style.display="none"; qInput.value=""; }

/* ---------- Umkreis ---------- */
$("#gps").onclick=()=>{
  if(!navigator.geolocation){ alert("Dein Browser unterstützt keine Standortbestimmung."); return; }
  const btn=$("#gps"); btn.classList.add("busy"); btn.querySelector(".t").textContent="…";
  navigator.geolocation.getCurrentPosition(
    pos=>{ btn.classList.remove("busy"); btn.querySelector(".t").textContent="Nähe"; showNearby(pos.coords.latitude,pos.coords.longitude,"Dein Standort"); },
    err=>{ btn.classList.remove("busy"); btn.querySelector(".t").textContent="Nähe"; alert("Standort nicht verfügbar: "+err.message); },
    {enableHighAccuracy:true,timeout:10000,maximumAge:30000});
};
function haversine(a,b,c,d){ const R=6371000,t=x=>x*Math.PI/180; const dLa=t(c-a),dLo=t(d-b);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function fmtDist(m){ return m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1).replace(".",",")+" km"; }

async function showNearby(lat,lon,label){
  resultsEl.innerHTML=`<div class="loading">📡 Suche Haltestellen nahe „${esc(label)}" …</div>`; resultsEl.style.display="block";
  try{
    const d=0.012, stops=await apiGet(`/map/stops?min=${lat-d},${lon-d}&max=${lat+d},${lon+d}`);
    const best=new Map();
    for(const s of stops){ const dist=haversine(lat,lon,s.lat,s.lon); const cur=best.get(s.name);
      if(!cur||dist<cur.dist) best.set(s.name,{id:s.stopId,name:s.name,dist}); }
    const list=[...best.values()].sort((a,b)=>a.dist-b.dist).slice(0,8);
    if(!list.length){ resultsEl.innerHTML=`<div class="loading">Keine Haltestellen in der Nähe gefunden.</div>`; return; }
    resultsEl.innerHTML=`<div class="grp">Nächste Haltestellen · ${esc(label)}</div>`+list.map(s=>
      `<button data-id="${esc(s.id)}" data-name="${esc(s.name)}"><span class="ic">🚏</span><span>${esc(s.name)}</span><span class="meta">${fmtDist(s.dist)}</span></button>`).join("");
    resultsEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{ addStop(b.dataset.id,b.dataset.name); closeResults(); });
  }catch(e){ resultsEl.innerHTML=`<div class="loading">⚠️ Umkreissuche fehlgeschlagen.</div>`; }
}

/* ---------- Gespeicherte Haltestellen ---------- */
function addStop(id,name){ if(!saved.find(s=>s.id===id)){ saved.push({id,name}); store(K_STOPS,saved); } setActive(id); }
function removeStop(id,ev){ ev.stopPropagation();
  saved=saved.filter(s=>s.id!==id); store(K_STOPS,saved);
  if(activeId===id){ lastDepartures=[]; setActive(saved[0]?.id??null); } else renderChips();
  if(!saved.length) showEmpty(); }
function setActive(id){ activeId=id; store(K_ACTIVE,id); lastDepartures=[]; renderChips();
  if(id) loadDepartures(); else showEmpty(); }
function renderChips(){
  chipsEl.innerHTML=saved.map(s=>`<div class="chip ${s.id===activeId?'active':''}" data-id="${esc(s.id)}"><span class="lbl">${esc(s.name)}</span><span class="x" title="Entfernen">✕</span></div>`).join("");
  chipsEl.querySelectorAll(".chip").forEach(c=>{ const id=c.dataset.id;
    c.querySelector(".lbl").onclick=()=>{ if(id!==activeId) setActive(id); };
    c.querySelector(".x").onclick=e=>removeStop(id,e); });
}

/* ---------- Filter / Favoriten ---------- */
$("#filters").querySelectorAll(".fbtn[data-mode]").forEach(b=>{
  const m=b.dataset.mode; b.classList.toggle("on", !!modeOn[m]);
  b.onclick=()=>{ modeOn[m]=!modeOn[m]; b.classList.toggle("on",modeOn[m]); store(K_FILTER,modeOn); refreshBoard(true); };
});
const favBtn=$("#favBtn"); favBtn.classList.toggle("on",favOnly);
favBtn.onclick=()=>{ favOnly=!favOnly; favBtn.classList.toggle("on",favOnly); store(K_FAVONLY,favOnly); refreshBoard(true); };

function toggleFav(key){ if(favs.has(key)) favs.delete(key); else favs.add(key); store(K_FAV,[...favs]); refreshBoard(false); }

/* ---------- Abfahrten ---------- */
async function loadDepartures(){
  const stop=saved.find(s=>s.id===activeId); if(!stop) return showEmpty();
  $("#stopName").textContent=stop.name;
  if(!lastDepartures.length) rowsEl.innerHTML=`<div class="loading">⏳ Lade Abfahrten …</div>`;
  $("#status").textContent="lädt …";
  try{
    const data=await apiGet(`/stoptimes?stopId=${encodeURIComponent(stop.id)}&n=${FETCH_N}&arriveBy=false`);
    lastDepartures=data.stopTimes||[]; $("#status").textContent="live · BW"; refreshBoard(true);
  }catch(e){ $("#status").textContent="offline";
    if(!lastDepartures.length) rowsEl.innerHTML=`<div class="empty"><div class="big">⚠️</div>Abfahrten konnten nicht geladen werden.<br>Wird alle 30 s erneut versucht …</div>`; }
}

// "MEX17 (19580)" -> "MEX17" (Zugnummer in Klammern entfernen)
function cleanLine(s){ return String(s||"").replace(/\s*\(\d+\)\s*$/,"").trim(); }

// Gefilterte, sortierte Liste aller anzeigbaren Abfahrten berechnen
function computeBoard(){
  const now=Date.now();
  boardList=lastDepartures.map(d=>{
    const plan=d.place?.scheduledDeparture||d.place?.departure;
    const real=d.place?.departure||plan;
    return {...d,_t:new Date(real).getTime(),_plan:new Date(plan).getTime(),_cat:categoryOf(d.mode),_key:favKey(d,activeId)};
  }).filter(d=>!isNaN(d._t)&&d._t>now-60000)
    .filter(d=>modeOn[d._cat]!==false && (!favOnly||favs.has(d._key)))
    .sort((a,b)=>a._t-b._t);
}

// Eine Seite (max. 5 Einträge) der berechneten Liste zeichnen
function renderPage(){
  const now=Date.now();
  const pages=Math.max(1, Math.ceil(boardList.length/PAGE));
  if(page>=pages) page=0;

  if(!boardList.length){
    const msg=favOnly ? "Keine favorisierten Linien in nächster Zeit.<br>Tippe in einer Zeile auf ☆, um eine Linie zu favorisieren."
                      : "Keine Abfahrten – passt evtl. ein Filter nicht?";
    rowsEl.innerHTML=`<div class="empty"><div class="big">${favOnly?'★':'🌙'}</div>${msg}</div>`;
    pagerEl.style.display="none"; $("#boardMeta").textContent=stamp(); return;
  }

  const slice=boardList.slice(page*PAGE, page*PAGE+PAGE);
  rowsEl.innerHTML=`<table class="deps"><colgroup><col class="c-star"><col class="c-line"><col class="c-dest"><col class="c-eta"></colgroup><tbody>`+
    slice.map(d=>{
      const mins=Math.round((d._t-now)/60000), isNow=mins<=0;
      const line=esc(cleanLine(d.routeShortName||d.displayName)||"–");
      const dir=esc(d.headsign||"—");
      const track=d.place?.track?`Gl./Steig ${esc(d.place.track)}`:"";
      const clock=new Date(d._t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
      const delayMin=Math.round((d._t-d._plan)/60000);
      const cancelled=d.cancelled||d.tripCancelled||d.place?.cancelled;
      let sub="";
      if(cancelled) sub=`<span class="cancelled">FÄLLT AUS</span>`;
      else if(d.realTime&&delayMin>0) sub=`<span class="delay">+${delayMin} min</span>`;
      else if(d.realTime&&delayMin<0) sub=`<span class="delay">${delayMin} min</span>`;
      else if(d.realTime) sub=`pünktlich`;
      else sub=`nach Plan`;
      const sep=track?" · ":"";
      const star=favs.has(d._key)?"★":"☆", starOn=favs.has(d._key)?"on":"";
      const eta=isNow?`<span class="eta-v now">sofort</span>`:`<span class="eta-v">${mins}</span><span class="eta-u"> min</span>`;
      return `<tr>
        <td class="td-star"><button class="star ${starOn}" data-key="${esc(d._key)}" title="Linie favorisieren">${star}</button></td>
        <td><div class="ln">${line}</div></td>
        <td class="td-dest"><div class="d-name">${dir}</div><div class="d-sub">${sub}${sep}${track}</div></td>
        <td class="td-eta">${eta}<div class="eta-clk">${clock}</div></td>
      </tr>`;
    }).join("")+`</tbody></table>`;
  rowsEl.querySelectorAll(".star").forEach(b=>b.onclick=()=>toggleFav(b.dataset.key));

  // Paginator-Punkte
  if(pages>1){
    pagerEl.style.display="flex";
    pagerEl.innerHTML=Array.from({length:pages},(_,i)=>`<span class="dot2 ${i===page?'on':''}" data-p="${i}"></span>`).join("")
      +`<span class="pinfo">${page+1}/${pages} · wechselt automatisch</span>`;
    pagerEl.querySelectorAll(".dot2").forEach(d=>d.onclick=()=>{ page=+d.dataset.p; renderPage(); });
  }else pagerEl.style.display="none";

  $("#boardMeta").textContent=stamp();
}

// Neu berechnen + zeichnen. resetPage=true springt auf Seite 1.
function refreshBoard(resetPage){ computeBoard(); if(resetPage) page=0; renderPage(); }

function showEmpty(){ $("#stopName").textContent="Keine Haltestelle gewählt"; $("#boardMeta").textContent=""; lastDepartures=[]; boardList=[]; page=0;
  pagerEl.style.display="none";
  rowsEl.innerHTML=`<div class="empty"><div class="big">🚏</div>Tippe eine Haltestelle oder Adresse ein – oder nutze <b>📍 Nähe</b>.</div>`; }
function stamp(){ return new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"}); }

/* ---------- Vollbild / Kiosk ---------- */
let wakeLock=null;
async function requestWakeLock(){ try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch{} }
function releaseWakeLock(){ try{ wakeLock&&wakeLock.release(); }catch{} wakeLock=null; }
function enterKiosk(){ document.body.classList.add("kiosk"); requestWakeLock();
  const el=document.documentElement; try{ el.requestFullscreen&&el.requestFullscreen().catch(()=>{}); }catch{} }
function exitKiosk(){ document.body.classList.remove("kiosk"); releaseWakeLock();
  try{ document.fullscreenElement&&document.exitFullscreen&&document.exitFullscreen().catch(()=>{}); }catch{} }
$("#fsBtn").onclick=()=> document.body.classList.contains("kiosk")?exitKiosk():enterKiosk();
$("#kioskExit").onclick=exitKiosk;
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement){ document.body.classList.remove("kiosk"); releaseWakeLock(); } });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&document.body.classList.contains("kiosk")) requestWakeLock(); });

/* ---------- Timer ---------- */
function startTimers(){ clearInterval(refreshTimer); clearInterval(tickTimer); clearInterval(pagerTimer);
  refreshTimer=setInterval(()=>{ if(activeId) loadDepartures(); },REFRESH_MS);
  tickTimer=setInterval(()=>{ if(activeId&&lastDepartures.length) refreshBoard(false); },1000);
  pagerTimer=setInterval(()=>{                       // alle 5 s eine Seite weiter
    if(!activeId||!boardList.length) return;
    const pages=Math.max(1,Math.ceil(boardList.length/PAGE));
    if(pages>1){ page=(page+1)%pages; renderPage(); }
  },PAGE_MS); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&activeId) loadDepartures(); });

/* ---------- Start ---------- */
if(!saved.length){ saved=[DEFAULT_STOP]; store(K_STOPS,saved); activeId=DEFAULT_STOP.id; store(K_ACTIVE,activeId); }
renderChips();
if(activeId&&saved.find(s=>s.id===activeId)) loadDepartures();
else if(saved.length) setActive(saved[0].id);
else showEmpty();
startTimers();
</script>
